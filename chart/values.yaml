replicaCount: 1

image:
  repository: ghcr.io/frikanalen/frontend
  # NEXT_PUBLIC_* values are embedded by Next.js at build time. The staging
  # image is built with NEXT_PUBLIC_DJANGO_URL=https://staging.frikanalen.no.
  tag: staging
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  hostname: beta.frikanalen.no
  certResolver: letsencrypt

resources: {}
