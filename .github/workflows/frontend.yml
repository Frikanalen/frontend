name: Frontend build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release PR or GitHub Release (main only)
        id: release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: googleapis/release-please-action@v5
        with:
          # No release-type here on purpose: passing it puts the action in
          # single-package mode, where release-please-config.json is never read
          # and its extra-files (chart/Chart.yaml) are silently ignored.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    name: Lint and test
    runs-on: ubuntu-latest
    # Ships the browsers and their system libraries prebuilt, which replaces a
    # ~470MB browser cache and a 181-package apt install on every run. The tag
    # MUST track @playwright/test in package.json: the image bakes in the
    # browser builds for exactly one Playwright release. The version check
    # below fails the run if the two drift apart.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Matches the Dockerfile's node:24 base so CI runs what ships. Also
          # satisfies orval's engines field, which requires >=22.18. Pinned
          # here rather than inherited from the container image so that a
          # Playwright image bump cannot move the Node version by surprise.
          node-version: "24"

      # Cache compressed package tarballs, not Yarn Classic's expanded cache
      # (previously 1.7GB). A restore prefix reuses unchanged packages on updates.
      - name: Restore Yarn package mirror
        uses: actions/cache@v4
        with:
          path: .yarn/offline-mirror
          key: yarn-mirror-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-mirror-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          yarn config set yarn-offline-mirror "$GITHUB_WORKSPACE/.yarn/offline-mirror"
          yarn config set yarn-offline-mirror-pruning true
          yarn install --frozen-lockfile --prefer-offline

      - name: Generate API client
        run: yarn orval

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      # Guards the container tag above against package.json drifting ahead of
      # it. Without this, a Playwright bump would silently re-download every
      # browser mid-run instead of failing with an actionable message.
      - name: Verify the image matches the installed Playwright
        # Container jobs default to `sh`, not `bash`, so this stays POSIX: no
        # process substitution, and the absent paths come back out of the
        # pipeline rather than from a variable assigned inside one.
        run: |
          set -eu
          absent=$(npx playwright install --dry-run \
            | awk '/Install location:/ { print $3 }' \
            | while read -r dir; do [ -d "$dir" ] || echo "$dir"; done)
          if [ -n "$absent" ]; then
            version=$(node -p 'require("@playwright/test/package.json").version')
            echo "::error::Container image is out of sync with @playwright/test $version. Bump the container tag in this workflow to match. Absent from the image:"
            echo "$absent" | sed 's/^/  /'
            exit 1
          fi
          echo "Image ships every browser this Playwright resolves to."

      # The suite stubs every backend call at the network layer, so this needs
      # no Django; DJANGO_URL points at a closed port to keep that honest.
      - name: End-to-end tests
        run: yarn test:e2e
        env:
          DJANGO_URL: http://127.0.0.1:9/
          # The container runs as root, but the runner mounts $HOME as
          # /github/home owned by pwuser, and Firefox refuses to start as root
          # from another user's home. Chromium and WebKit do not care. Scoped
          # to this step so Yarn configuration uses the same home during
          # dependency installation and API generation.
          HOME: /root

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build image
    needs: [release]
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/frikanalen/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.release.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' && needs.release.outputs.created == 'true' }}

      # Only export the stable dependency stage. Exporting every intermediate
      # app layer with mode=max took 6-7 minutes for a ~30-second app build.
      - name: Cache Docker dependencies
        uses: docker/build-push-action@v7
        with:
          context: .
          target: deps
          cache-from: type=gha,scope=frontend-deps-v1
          cache-to: type=gha,scope=frontend-deps-v1,mode=min

      # Build into the local daemon first so the image can actually be started
      # before it is published. A green `next build` does not prove the
      # standalone output boots: the runtime stage ships only .next/standalone,
      # so anything the file tracer failed to copy is missing there and nowhere
      # else. That class of bug is invisible until a container starts.
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: frontend:smoke-test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-deps-v1

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 frontend:smoke-test

          # /health/isAlive is a static Response, so it needs no Django backend.
          for _ in $(seq 1 30); do
            # No -S: connection-refused while the server is still starting is
            # expected, and the container logs are dumped on failure anyway.
            if curl -fs http://localhost:3000/health/isAlive | grep -q OK; then
              echo "Container booted and served a request."
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=smoke)" ]; then
              echo "::error::Container exited before becoming ready."
              docker logs smoke
              exit 1
            fi
            sleep 2
          done

          echo "::error::Timed out waiting for /health/isAlive."
          docker logs smoke
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f smoke || true

      # Pass the exact smoke-tested image to publication; never rebuild it there.
      - name: Save tested image
        run: docker save frontend:smoke-test | gzip -1 > "$RUNNER_TEMP/frontend-image.tar.gz"

      - name: Upload tested image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: ${{ runner.temp }}/frontend-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish image
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: docker load --input "$RUNNER_TEMP/frontend-image.tar.gz"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag frontend:smoke-test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
